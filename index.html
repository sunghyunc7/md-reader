.ic:hover{background:var(--panel)}.ic svg{width:22px;height:22px;fill:currentColor}

# 연구실 서버 점검 메모

2026년 11월 정기 점검 결과를 정리한 **예시 문서**입니다. 파일을 열거나 붙여 넣으면 이 내용이 바뀝니다.

## 요약

이번 점검에서 큰 장애는 없었습니다. 다만 GPU 서버 두 대의 펌웨어가 오래되어 업데이트가 필요합니다. 백업 서버는 디스크 사용률이 80%를 넘었으므로, 다음 달까지 오래된 스냅숏을 정리합니다.

## 서버별 상태

| 서버 | 역할 | 상태 | 조치 |
|---|---|---|---|
| gpu01 | 학습 | 정상 | 펌웨어 업데이트 |
| gpu02 | 학습 | 정상 | 펌웨어 업데이트 |
| infra01 | DNS·모니터링 | 정상 | 없음 |
| backup01 | 백업 | 주의 | 스냅숏 정리 |

## 할 일

- [x] UPS 배터리 상태 확인
- [ ] gpu01, gpu02 BMC 펌웨어 업데이트 (11월 20일~22일)
- [ ] backup01 스냅숏 보존 기간을 90일 → 60일로 변경
  - 변경 전에 [보존 정책 문서](https://example.com/policy)를 다시 확인합니다.

## 점검 명령

디스크 사용률은 다음 명령으로 확인했습니다.

```bash
df -h /srv/backup
zfs list -t snapshot | wc -l
```

> 참고: 펌웨어 업데이트 중에는 해당 서버의 작업을 미리 옮겨야 합니다. 작업 중단 공지는 이틀 전에 보냅니다.

---

다음 점검은 12월 둘째 주에 진행합니다.

# Lab Server Check Notes

This is a **sample document** summarizing the November 2026 routine check. Open or paste a file to replace it.

## Summary

No major outages were found. However, the firmware on two GPU servers is out of date and needs an update. Disk usage on the backup server is above 80%, so old snapshots will be cleaned up by next month.

## Status by server

| Server | Role | Status | Action |
|---|---|---|---|
| gpu01 | Training | OK | Firmware update |
| gpu02 | Training | OK | Firmware update |
| infra01 | DNS, monitoring | OK | None |
| backup01 | Backup | Warning | Clean up snapshots |

## To do

- [x] Check the UPS battery status
- [ ] Update the BMC firmware on gpu01 and gpu02 (Nov 20~22)
- [ ] Change the backup01 snapshot retention from 90 days → 60 days
  - Re-check the [retention policy](https://example.com/policy) first, e.g. the rules on legal holds.

## Commands used

Disk usage was checked with the following commands.

```bash
df -h /srv/backup
zfs list -t snapshot | wc -l
```

> Note: Move jobs off a server before updating its firmware. Send the downtime notice two days ahead.

---

The next check is in the second week of December.

const st={units:[],items:[],idx:0,playing:false,done:false,token:0,utt:null,key:'',voice:null,voices:[],curEl:null,

/* ---------- speech rules per reading language ---------- */
const SAY={
ko:{done:'완료, ',table:'표. ',link:' 링크 ',range:'$1에서 $2',arrow:'에서 ',sec:'$1절',circ:n=>n+'번, ',cps:6.5,chunk:70,lang:'ko-KR'},
en:{done:'Done, ',table:'Table. ',link:' link ',range:'$1 to $2',arrow:' to ',sec:'section $1',circ:n=>n+', ',cps:14,chunk:150,lang:'en-US'}};
function detect(t){
  t=t.replace(/```[\s\S]*?```/g,'').replace(/https?:\/\/\S+/g,'');
  const h=(t.match(/[\uAC00-\uD7A3]/g)||[]).length,l=(t.match(/[A-Za-z]/g)||[]).length;
  return h/(h+l||1)>.15?'ko':'en';
}

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- inline markdown: display ---------- */
function inl(s){
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=esc(s.replace(/<\/?[a-zA-Z][^>]*>/g,''));
  s=s.replace(/!\[([^\]]*)\]\([^)]*\)/g,(m,a)=>'<span class="mk">['+T('img')+(a?': '+a:'')+']</span>')
   .replace(/\[([^\]]+)\]\((https?:[^)\s]+)[^)]*\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
   .replace(/\[([^\]]+)\]\([^)]*\)/g,'<u>$1</u>')
   .replace(/\*\*([^*]+)\*\*|__([^_]+)__/g,(m,a,b)=>'<b>'+(a||b)+'</b>')
   .replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>')
   .replace(/~~([^~]+)~~/g,'<s>$1</s>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,n)=>'<code>'+esc(codes[n])+'</code>');
}

/* ---------- inline markdown: what gets spoken ---------- */
function say(s){
  const R=SAY[st.dl];
  return s.replace(/!\[[^\]]*\]\([^)]*\)/g,'')
   .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\[([^\]]+)\]\[[^\]]*\]/g,'$1').replace(/\[\^[^\]]+\]/g,'')
   .replace(/<https?:[^>]+>/g,R.link).replace(/https?:\/\/[^\s)]+/g,R.link)
   .replace(/<\/?[a-zA-Z][^>]*>/g,' ')
   .replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')
   .replace(/`([^`]*)`/g,'$1').replace(/\*\*|__|~~/g,'')
   .replace(/(\S)\s*~\s*(\d)/g,R.range)
   .replace(/\s*(→|⇒|->|=>|⟶)\s*(?=\d)/g,R.arrow).replace(/\s*(→|⇒|->|=>|←|↔|⟶)\s*/g,', ')
   .replace(/\s+[—–]\s+/g,', ').replace(/§\s*([\w.-]*\w)/g,R.sec)
   .replace(/[\u2460-\u2473]/g,c=>R.circ(c.charCodeAt(0)-0x245F))
   .replace(/([^\d\s])\/([^\d\s])/g,'$1 $2')
   .replace(/[·•|]/g,', ').replace(/[~*_#>`]+/g,' ')
   .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'')
   .replace(/\s*,(\s*,)+/g,',').replace(/^\s*[,.]\s*/,'')
   .replace(/\s+/g,' ').replace(/\(\s*\)/g,'').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').trim();
}
const codeSay=l=>l.replace(/[{}()\[\];<>|$`"'\\=]+/g,' ').replace(/\s+/g,' ').trim();

/* ---------- sentence splitting (links, code spans and abbreviations protected) ---------- */
const ABBR=/\b(e\.g|i\.e|etc|vs|cf|al|approx|Fig|Figs|Eq|Eqs|Sec|No|Dr|Mr|Ms|Mrs|Prof|Inc|Ltd|Jr|Sr|St)\.(?=\s)/g;
function sents(src){
  const tk=[];let t=src.replace(/!?\[[^\]]*\]\([^)]*\)|`[^`]*`/g,m=>{tk.push(m);return '\u0001'+(tk.length-1)+'\u0001'});
  t=t.replace(ABBR,m=>m.replace(/\./g,'\u0003'));
  const out=[],push=p=>{if(p.length<=200){out.push(p);return}let c='';for(const w of p.split(' ')){if(c&&(c+' '+w).length>160){out.push(c);c=w}else c=c?c+' '+w:w}if(c)out.push(c)};
  t=t.replace(/\n(?=\*\*|__|[^\s:]{1,20}:\s)/g,'\u0002').replace(/(?<=[.!?。…다요])\n/g,'\u0002').replace(/\n/g,' ');
  for(const p of t.split(/\u0002|(?<=[.!?。…][*_)"'”’]*)\s+/)){
    if(p.length<=200){out.push(p);continue}
    let c='';for(const w of p.split(/(?<=[,;:，])\s+/)){if(c&&(c+' '+w).length>200){push(c);c=w}else c=c?c+' '+w:w}
    if(c)push(c);
  }
  return out.filter(s=>s.trim()).map(s=>s.replace(/\u0003/g,'.').replace(/\u0001(\d+)\u0001/g,(m,n)=>tk[n]));
}

/* ---------- block parser ---------- */
const isSep=l=>l.includes('-')&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l);
const isStart=l=>/^\s*(#{1,6}\s|```|~~~|>|([-*+]|\d+[.)])\s)/.test(l)||/^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
function parse(md,top){
  const L=md.replace(/\r\n?/g,'\n').split('\n'),B=[];let i=0,m;
  if(top&&/^---\s*$/.test(L[0]||'')){let j=1;while(j<L.length&&!/^(---|\.\.\.)\s*$/.test(L[j]))j++;if(j<L.length)i=j+1}
  const tblAt=k=>L[k].includes('|')&&k+1<L.length&&isSep(L[k+1]);
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(m=l.match(/^\s*(```+|~~~+)(.*)$/)){const c=[];i++;while(i<L.length&&!L[i].trim().startsWith(m[1]))c.push(L[i++]);i++;B.push({t:'code',text:c.join('\n')});continue}
    if(m=l.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/)){B.push({t:'h',lv:m[1].length,text:m[2]});i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){B.push({t:'hr'});i++;continue}
    if(tblAt(i)){const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const head=cells(l),rows=[];i+=2;
      while(i<L.length&&L[i].includes('|')&&L[i].trim())rows.push(cells(L[i++]));B.push({t:'table',head,rows});continue}
    if(/^\s*>/.test(l)){const c=[];while(i<L.length&&/^\s*>/.test(L[i]))c.push(L[i++].replace(/^\s*>\s?/,''));parse(c.join('\n'),false).forEach(b=>{b.q=1;B.push(b)});continue}
    if(m=l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/)){let text=m[3];const ind=m[1].replace(/\t/g,'    ').length;i++;
      while(i<L.length&&L[i].trim()&&!isStart(L[i])&&!tblAt(i))text+='\n'+L[i++].trim();
      let chk=null;const c=text.match(/^\[([ xX])\]\s+(.*)$/);if(c){chk=c[1]!==' ';text=c[2]}
      B.push({t:'li',d:Math.min(4,Math.floor(ind/2)),mk:/\d/.test(m[2])?m[2]:'',chk,text});continue}
    const p=[];while(i<L.length&&L[i].trim()&&!isStart(L[i])&&!tblAt(i))p.push(L[i++].trim());
    if(!p.length)p.push(L[i++].trim());
    B.push({t:'p',text:p.join('\n')});
  }
  return B;
}

/* ---------- render document + build speakable units ---------- */
function render(blocks){
  let seq=0;const units=[],toc=[],out=[],R=SAY[st.dl];
  const U=(kind,b,v,x)=>{const id=seq++;units.push(Object.assign({id,kind,b,say:v},x));return id};
  const para=(text,kind,b,pre)=>sents(text).map((s,k)=>{let v=say(s);const h=inl(s);if(!v)return h;if(pre&&!k)v=pre+v;return `<span class="s" data-u="${U(kind,b,v)}">${h}</span>`}).join(' ');
  const tag=`<span class="tag">${T('notRead')}</span>`;
  blocks.forEach((bk,b)=>{
    const q=bk.q?' q':'';
    if(bk.t==='h'){const v=say(bk.text),hn='h'+Math.min(6,bk.lv+1);let h=inl(bk.text);
      if(v){const id=U('h',b,v);if(bk.lv<=3)toc.push({id,lv:bk.lv,text:v});h=`<span class="s" data-u="${id}">${h}</span>`}
      out.push(`<${hn} class="l${bk.lv}${q}">${h}</${hn}>`)}
    else if(bk.t==='p')out.push(`<p class="${q}">${para(bk.text,'p',b)}</p>`);
    else if(bk.t==='li'){const mk=bk.chk!=null?`<span class="cb${bk.chk?' on':''}"></span>`:`<span class="mk">${bk.mk?esc(bk.mk):'•'}</span>`;
      out.push(`<div class="li${q}" style="--d:${bk.d}">${mk}<div>${para(bk.text,'p',b,bk.chk?R.done:'')}</div></div>`)}
    else if(bk.t==='table'){const head=bk.head.map(say),n=head.filter(Boolean);
      const hid=n.length?U('table',b,R.table+n.join(', ')):null;
      const rows=bk.rows.map(r=>{const first=say(r[0]||''),rest=r.slice(1).map((c,k)=>{const v=say(c);return v?(head[k+1]?head[k+1]+' '+v:v):''}).filter(Boolean).join(', ');
        const v=[first,rest].filter(Boolean).join('. ');const id=v?U('table',b,v):null;
        return `<tr${id!=null?` data-u="${id}"`:''}>${bk.head.map((x,k)=>`<td>${inl(r[k]||'')}</td>`).join('')}</tr>`}).join('');
      out.push(`<div class="tbl${q}">${tag}<table><thead><tr${hid!=null?` data-u="${hid}"`:''}>${bk.head.map(h=>`<th>${inl(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`)}
    else if(bk.t==='code'){const lines=bk.text.split('\n').map(l=>{const v=codeSay(l);return v?`<span class="s" data-u="${U('code',b,v)}">${esc(l)}</span>`:esc(l)});
      out.push(`<pre class="cd${q}">${tag}<code>${lines.join('\n')}</code></pre>`)}
    else if(bk.t==='hr')out.push('<hr>');
  });
  const doc=$('#doc');doc.lang=st.dl;
  doc.innerHTML=out.join('')||`<p>${T('empty')}</p>`;
  $('#toc').innerHTML=toc.length>1?`<p class="tt">${T('toc')}</p>`+toc.map(t=>`<a href="#" class="t${t.lv}" data-j="${t.id}">${esc(t.text)}</a>`).join(''):'';
  st.units=units;
}

function setItems(keepId){
  document.body.classList.toggle('notab',!st.tables);document.body.classList.toggle('nocode',!st.code);
  st.items=st.units.filter(u=>(u.kind!=='table'||st.tables)&&(u.kind!=='code'||st.code));
  let i=st.items.findIndex(u=>u.id>=keepId);if(i<0)i=st.items.length-1;st.idx=Math.max(0,i);
}

/* ---------- position, highlight, progress ---------- */
function follow(el){
  const r=el.getBoundingClientRect(),top=$('#bar').offsetHeight+16;
  if(r.top<top||r.bottom>innerHeight-60)scrollBy({top:r.top-top-(innerHeight-top)*.3,behavior:reduce?'auto':'smooth'});
}
function mark(scroll){
  if(st.curEl)st.curEl.classList.remove('cur');
  const it=st.items[st.idx];st.curEl=null;
  if(it){const el=$('#doc').querySelector(`[data-u="${it.id}"]`);st.curEl=el;if(el){el.classList.add('cur');if(scroll)follow(el)}
    store.set('pos:'+st.key,it.id);
    let hid=-1;for(let k=st.idx;k>=0;k--)if(st.items[k].kind==='h'){hid=st.items[k].id;break}
    $$('#toc a').forEach(a=>a.classList.toggle('on',+a.dataset.j===hid))}
  prog();
}
function prog(){
  const n=st.items.length,i=st.idx;
  $('#fill').style.width=n?((i+(st.done?1:0))/n*100)+'%':'0';
  let c=0;for(let k=i;k<n;k++)c+=st.items[k].say.length;
  const m=Math.round(c/(SAY[st.dl].cps*st.rate)/60);
  $('#pos').textContent=n?`${i+1} / ${n} ${T('sent')} · ${st.done?T('done'):m<1?T('lt1'):T('left')(m)}`:T('none');
}
function ui(){const b=$('#play'),k=st.playing?'pause':'play';b.innerHTML=ICON[k];b.setAttribute('aria-label',T(k));b.title=T(k)+' (Space)';awake(st.playing)}
let msgKey=null;
function msg(t,key){msgKey=key||null;const m=$('#msg');m.textContent=t||'';m.hidden=!t}

/* ---------- speech ---------- */
const isNet=v=>!!v&&(!v.localService||/online|natural|google/i.test(v.name));
/* online (neural) voices break on utterances longer than ~14 s, so long sentences are fed in short pieces */
function chunk(t,max){
  if(t.length<=max)return[t];
  const n=Math.ceil(t.length/max),tg=t.length/n,out=[];let c='',used=0;
  for(const w of t.split(' ')){
    const nx=c?c+' '+w:w;used+=w.length+1;
    if(c&&nx.length>Math.min(max,tg*1.2)){out.push(c);c=w}
    else{c=nx;if(c.length>tg*.6&&t.length-used>tg*.4&&/[,;:]$/.test(w)){out.push(c);c=''}}
  }
  if(c)out.push(c);return out;
}
function speakAt(i){
  if(!st.items.length)return;
  st.idx=Math.max(0,Math.min(i,st.items.length-1));st.done=false;mark(true);
  if(!st.playing||!synth)return;
  const tok=++st.token,busy=synth.speaking||synth.pending,R=SAY[st.dl];
  synth.cancel();
  const it=st.items[st.idx],parts=isNet(st.voice)?chunk(it.say,Math.round(R.chunk*st.rate)):[it.say];let pi=0;
  const after=()=>{const nx=st.items[st.idx+1];
    if(!nx){st.playing=false;st.done=true;ui();prog();return}
    const gap=it.kind==='h'?450:nx.b!==it.b?180:0;
    setTimeout(()=>{if(tok===st.token&&st.playing)speakAt(st.idx+1)},gap)};
  const part=()=>{
    const u=new SpeechSynthesisUtterance(parts[pi]);
    if(st.voice){u.voice=st.voice;u.lang=st.voice.lang}else u.lang=R.lang;
    u.rate=st.rate;
    u.onstart=()=>{if(!st.reloaded){st.reloaded=true;setTimeout(loadVoices,800)}};
    u.onend=()=>{if(tok!==st.token||!st.playing)return;if(++pi<parts.length)part();else after()};
    u.onerror=e=>{if(tok!==st.token||e.error==='interrupted'||e.error==='canceled')return;
      if(e.error==='not-allowed'){pause();msg(T('blocked'));return}
      msg(T('err')(e.error));setTimeout(()=>{if(tok===st.token&&st.playing)speakAt(st.idx+1)},300)};
    st.utt=u;synth.speak(u);
  };
  const go=()=>{if(tok===st.token&&st.playing){synth.resume();part()}};
  busy?setTimeout(go,40):go();
}
function play(){
  if(!synth){msg(T('noSynth'),'noSynth');return}
  if(!st.items.length)return;
  if(st.done){st.done=false;st.idx=0}
  msg('');st.playing=true;ui();speakAt(st.idx);
}
function pause(){st.playing=false;st.token++;if(synth)synth.cancel();ui()}
const toggle=()=>st.playing?pause():play();
function jumpHead(dir){
  const I=st.items;let k=st.idx+dir;
  if(dir<0&&st.playing&&I[st.idx]&&I[st.idx].kind!=='h')k=st.idx;
  while(k>=0&&k<I.length&&I[k].kind!=='h')k+=dir;
  if(k>=0&&k<I.length)speakAt(k);else if(dir<0)speakAt(0);
}

/* ---------- voices (chosen per reading language) ---------- */
/* macOS novelty voices (old multilingual engine) — unusable for reading documents, hidden unless asked */
const NOVELTY=/^(Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Kathy|Fred)\b/i;
function loadVoices(){
  if(!synth)return;
  const vs=synth.getVoices();if(!vs.length)return;
  st.voices=vs;
  const dl=st.dl,re=new RegExp('^'+dl,'i'),ok=v=>!NOVELTY.test(v.name);
  const us=v=>/^en[-_]US/i.test(v.lang);
  const fav=dl==='ko'?/sunhi|yuna|유나/i:/ava|andrew|aria|jenny|samantha/i;
  /* ranking: Edge neural > Google network voice > premium > enhanced > the rest */
  const score=v=>(/natural/i.test(v.name)?10:/online/i.test(v.name)?6:/^google/i.test(v.name)?5:0)+(/premium|프리미엄/i.test(v.name)?4:/enhanced|향상/i.test(v.name)?3:0)
    +(fav.test(v.name)?1:0)+(v.localService?1:0);
  /* best voices first: (English: American first) then by ranking */
  const mineAll=vs.filter(v=>re.test(v.lang)).sort((a,b)=>(dl==='en'?us(b)-us(a):0)||score(b)-score(a)),mine=mineAll.filter(ok),other=vs.filter(v=>!re.test(v.lang));
  /* English defaults to an American voice; other English accents are used only when no en-US voice exists */
  const pool=dl==='en'&&mine.some(us)?mine.filter(us):mine;
  const saved=store.get('voice:'+dl,'');
  st.voice=vs.find(v=>v.voiceURI===saved)||pool.slice().sort((a,b)=>score(b)-score(a))[0]||mineAll[0]||null;
  const shown=(st.allVoices?mineAll:mine).slice();if(st.voice&&re.test(st.voice.lang)&&!shown.includes(st.voice))shown.unshift(st.voice);
  const hidden=mineAll.length-mine.length+other.length;
  const nm=v=>v.name.replace(/^Microsoft\s+/,'').replace(/\s+Online \(Natural\)/i,'').replace(/\s*-\s*[^-]*\([^)]*\)\s*$/,'');
  const opt=v=>`<option value="${esc(v.voiceURI)}"${v===st.voice?' selected':''}>${esc(nm(v))}${isNet(v)?' · '+T('online'):''}${/^ko-KR$/i.test(v.lang)?'':' ('+esc(v.lang)+')'}</option>`;
  $('#voice').innerHTML=(st.voice?'':`<option value="">${T('defVoice')}</option>`)
    +(shown.length?`<optgroup label="${T('lang')[dl]}">${shown.map(opt).join('')}</optgroup>`:'')
    +(st.allVoices&&other.length?`<optgroup label="${T('other')}">${other.map(opt).join('')}</optgroup>`:'')
    +(hidden?`<option value="__all">${st.allVoices?T('fewer'):T('more')(hidden)}</option>`:'');
  if(!mine.length)msg(T('noVoice')(T('lang')[dl]),'noVoice');else if(msgKey==='noVoice')msg('');
}

/* ---------- reading language ---------- */
function fillRl(){
  const det=detect(st.text);
  $('#rl').innerHTML=[['auto',`${T('auto')} (${T('lang')[det]})`],['ko',T('lang').ko],['en',T('lang').en]]
    .map(([v,l])=>`<option value="${v}"${v===st.rlPref?' selected':''}>${l}</option>`).join('');
}
/* re-render the current document, keeping the reading position */
function rerender(){
  const keep=st.items[st.idx]?st.items[st.idx].id:0,was=st.playing;if(was)pause();
  st.dl=st.rlPref==='auto'?detect(st.text):st.rlPref;
  render(parse(st.text,true));setItems(keep);mark(false);fillRl();loadVoices();
  if(was)play();
}

/* ---------- interface language ---------- */
function applyUi(){
  const L=st.ui;document.documentElement.lang=L;document.title=T('title');
  $$('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));
  $$('[data-t-html]').forEach(e=>e.innerHTML=T(e.dataset.tHtml));
  $$('[data-t-ph]').forEach(e=>e.placeholder=T(e.dataset.tPh));
  $$('[data-t-aria]').forEach(e=>{const t=T(e.dataset.tAria);e.setAttribute('aria-label',t);e.title=t+(e.dataset.k?` (${e.dataset.k})`:'')});
  $('#toc').setAttribute('aria-label',T('toc'));document.body.dataset.drop=T('drop');
  $('#uiKo').setAttribute('aria-pressed',L==='ko');$('#uiEn').setAttribute('aria-pressed',L==='en');
  $('#tip').textContent=T('tip');
  if(!$('#voice').options.length||!$('#voice').value)$('#voice').innerHTML=`<option value="">${T('defVoice')}</option>`;
  if(msgKey==='noSynth')msg(T('noSynth'),'noSynth');
  ui();
}
function setUi(L){
  if(L===st.ui)return;st.ui=L;store.set('ui',L);applyUi();
  if(st.sample)loadSample();else{rerender();$('#fname').textContent=st.name}
}

/* ---------- loading documents ---------- */
function loadDoc(text,name,sample){
  pause();st.text=text;st.name=name;st.sample=!!sample;st.key=name+':'+text.length;st.done=false;
  st.dl=st.rlPref==='auto'?detect(text):st.rlPref;
  render(parse(text,true));
  $('#fname').textContent=sample?T('sample'):name;
  setItems(+store.get('pos:'+st.key,0)||0);
  scrollTo(0,0);mark(st.idx>0);fillRl();loadVoices();
  if(!sample)store.set('last',{text:text.length<1500000?text:'',name});
}
const loadSample=()=>loadDoc($('#sample-'+st.ui).textContent.replace(/^\n/,''),'sample-'+st.ui,true);
function openFile(f){if(!f)return;f.text().then(t=>loadDoc(t,f.name)).catch(()=>msg(T('readFail')))}

/* ---------- events ---------- */
$('#play').onclick=toggle;
$('#prev').onclick=()=>speakAt(st.idx-1);
$('#next').onclick=()=>speakAt(st.idx+1);
$('#prevH').onclick=()=>jumpHead(-1);
$('#nextH').onclick=()=>jumpHead(1);
$('#uiKo').onclick=()=>setUi('ko');
$('#uiEn').onclick=()=>setUi('en');
$('#file').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
$('#pasteBtn').onclick=()=>{const p=$('#paste');p.hidden=!p.hidden;if(!p.hidden)$('#pasteTa').focus()};
$('#pasteX').onclick=()=>{$('#paste').hidden=true};
$('#pasteGo').onclick=()=>{const t=$('#pasteTa').value;if(!t.trim())return;loadDoc(t,T('pasted'));$('#paste').hidden=true};
const rate=$('#rate'),rateV=$('#rateV');
rate.value=st.rate;rateV.textContent=st.rate.toFixed(2)+'×';
rate.oninput=()=>{rateV.textContent=(+rate.value).toFixed(2)+'×'};
rate.onchange=()=>{st.rate=+rate.value;store.set('rate',st.rate);prog();if(st.playing)speakAt(st.idx)};
$('#rl').onchange=e=>{st.rlPref=e.target.value;store.set('rl',st.rlPref);rerender()};
$('#voice').onchange=e=>{if(e.target.value==='__all'){st.allVoices=!st.allVoices;loadVoices();return}st.voice=st.voices.find(v=>v.voiceURI===e.target.value)||null;store.set('voice:'+st.dl,e.target.value);if(st.playing)speakAt(st.idx)};
const opt=(id,k)=>{const c=$(id);c.checked=st[k];c.onchange=()=>{const keep=st.items[st.idx]?st.items[st.idx].id:0;st[k]=c.checked;store.set(k,c.checked);setItems(keep);mark(false);if(st.playing)speakAt(st.idx)}};
opt('#tab','tables');opt('#cod','code');
$('#doc').addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const el=e.target.closest('[data-u]');if(!el)return;
  const k=st.items.findIndex(u=>u.id===+el.dataset.u);if(k>=0)speakAt(k);
});
$('#toc').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();const k=st.items.findIndex(u=>u.id===+a.dataset.j);if(k>=0)speakAt(k)});
addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'){e.preventDefault();e.shiftKey?jumpHead(1):speakAt(st.idx+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();e.shiftKey?jumpHead(-1):speakAt(st.idx-1)}
});
let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;document.body.classList.add('drag')});
addEventListener('dragleave',()=>{if(--dc<=0){dc=0;document.body.classList.remove('drag')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;document.body.classList.remove('drag');openFile(e.dataTransfer.files[0])});
addEventListener('pagehide',()=>{if(synth)synth.cancel()});
new ResizeObserver(()=>document.documentElement.style.setProperty('--bh',$('#bar').offsetHeight+'px')).observe($('#bar'));
$('#setBtn').onclick=()=>{const on=document.body.classList.toggle('showset');$('#setBtn').setAttribute('aria-expanded',on)};

/* ---------- keep the screen on while reading ---------- */
let wl=null;
async function awake(on){try{
  if(on&&!wl&&'wakeLock' in navigator&&document.visibilityState==='visible'){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
  else if(!on&&wl){const w=wl;wl=null;await w.release()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&st.playing)awake(true)});

/* ---------- start ---------- */
applyUi();
if(synth){synth.addEventListener?synth.addEventListener('voiceschanged',loadVoices):synth.onvoiceschanged=loadVoices}
else msg(T('noSynth'),'noSynth');
const last=store.get('last',null);
if(last&&last.text)loadDoc(last.text,last.name);else loadSample();
window.__mdr=st;

/* ---------- app: install, offline, open-with, share ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
if('launchQueue' in window)launchQueue.setConsumer(async p=>{if(p.files&&p.files.length){const h=p.files[0];openFile(await h.getFile())}});
if(/[?&]shared=1/.test(location.search)&&'caches' in window){
  caches.open('mdr-share').then(c=>c.match('./__shared').then(r=>{if(!r)return;
    return r.text().then(t=>{const n=r.headers.get('x-name');if(t.trim())loadDoc(t,n?decodeURIComponent(n):T('shared'));return c.delete('./__shared')})}))
  .finally(()=>history.replaceState(null,'',location.pathname));
}
}
</script>
</body>
</html>
